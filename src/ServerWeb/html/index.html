    <link rel="stylesheet" href="/ServerWeb/css/main_page.css">

    <!-- Header -->
    <header id="nav-wrapper items-center flex-wrap">
        <nav class="nav-header">
            <div class="nav-left">
                <a href="/" id="home-nav" class="home-nav">Home</a>
                <a href="/played" id="game-nav" class="home-nav">Game played</a>
            </div>

            <div class="title-web" >
                <img src="/ServerWeb/img/logo.jpg" alt="" height="20px" width="20px">
                <div class="title-name">TTLab Chess</div>
                <div class="setting-icon"><i class="fa-solid fa-gear"></i></div>
            </div>
        </nav>

    <!-- MAIN PAGE -->
    <div id="main-wrapper">
        <main class="dashboard-game" id="dashboard-view">
            <div class="dashboard-game-list">

                    <div class="empty-text">Chưa có ván cờ nào</div>
                </div> 
                <div class="game-playing"></div>
            </div>
        </main>
    </div>


    <script src="/lib/chessboardjs-1.0.0/js/chessboard-1.0.0.min.js"></script>
