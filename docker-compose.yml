services:
  ttlab-chess-app:
    build: .
    container_name: ttlab-chess-app
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    env_file:
      - .env

  frontend:
    build: ./frontend
    container_name: chess-frontend
    ports:
      - "4000:3000"
    environment:
      - API_URL=http://ttlab-chess-app:8080
    depends_on:
      - ttlab-chess-app
