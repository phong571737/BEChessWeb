version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: ttlab-chess-db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ttlab-chess
    volumes:
      - mongodb_data:/data/db
    networks:
      - ttlab-network

  app:
    build: .
    container_name: ttlab-chess-app
    ports:
      - "${PORT}:${PORT}"
    environment:
      MONGO_URI: ${MONGO_URI}
      PORT: ${PORT}
      SERVER_NAME: ${SERVER_NAME}
      AUTHOR: ${AUTHOR}
      VERCEL_WEB: ${VERCEL_WEB}
      URL_HIVEMQTT: ${URL_HIVEMQTT}
      MQTT_USER: ${MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_PORT: ${MQTT_PORT}
      MQTT_TOPIC_GET_IP: ${MQTT_TOPIC_GET_IP}
    depends_on:
      - mongodb
    networks:
      - ttlab-network
    restart: unless-stopped

volumes:
  mongodb_data:

networks:
  ttlab-network:
    driver: bridge