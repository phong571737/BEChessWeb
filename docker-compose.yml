services:
  ttlab-chess-app:
    build: .
    container_name: ttlab-chess-app
    ports:
      - "${PORT}:${PORT}"
    env_file:
      - .env
    environment:
      RECOVER_SERVICE_URL: ${RECOVER_SERVICE_URL}
    depends_on:
      - recover-service

  recover-service:
    build:
      context: .
      dockerfile: recover_service/Dockerfile
    container_name: chess-recover-service
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        API_URL: ${BACKEND_INTERNAL_URL}
        BACKEND_PROXY_URL: ${BACKEND_INTERNAL_URL}
        # One public origin is compiled into both browser REST and Socket.IO URLs.
        NEXT_PUBLIC_API_URL: ${BACKEND_PUBLIC_URL}
        NEXT_PUBLIC_SOCKET_URL: ${BACKEND_PUBLIC_URL}
        NEXT_PUBLIC_BASE_PATH: ${FRONTEND_BASE_PATH}
    container_name: chess-frontend
    ports:
      - "4000:3000"
    environment:
      - API_URL=${BACKEND_INTERNAL_URL}
    depends_on:
      - ttlab-chess-app

