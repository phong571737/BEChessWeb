services:

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chess-server
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      PORT: "8080"
      MONGO_URI: ${MONGO_URI}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
    networks:
      - chess-net

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        # Same-origin via nginx — no need to hardcode a port
        NEXT_PUBLIC_SOCKET_URL: ""
        API_URL: http://server:8080
    container_name: chess-client
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - server
    networks:
      - chess-net

  nginx:
    image: nginx:alpine
    container_name: chess-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server
      - client
    networks:
      - chess-net

networks:
  chess-net:
    driver: bridge
